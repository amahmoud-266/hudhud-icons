# Rebuilds styles/Hudhud.mapcss (icons embedded) every time an image
# in AI/ or Basic/ (or the template / builder) changes.
name: Build Hudhud style

on:
  push:
    branches: [main]
    paths:
      - 'AI/**'
      - 'Basic/**'
      - 'Hudhud.template.mapcss'
      - 'tools/build_hudhud_style.py'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: build-hudhud-style
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install pillow
      - run: python tools/build_hudhud_style.py
      - name: Commit rebuilt style
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add styles/Hudhud.mapcss
          if git diff --cached --quiet; then echo "No changes"; exit 0; fi
          git commit -m "Rebuild Hudhud.mapcss (embedded icons)"
          git pull --rebase origin main
          git push origin HEAD:main
